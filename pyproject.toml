[project]
name = "pr-review-loop"
version = "0.1.0"
description = "Oracle/ChatGPT pull-request review and submission skill"
authors = [{name = "dceoy", email = "1938249+dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "1938249+dceoy@users.noreply.github.com"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/dceoy/pr-review-loop.git"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff >= 0.16.1",
  "pyright >= 1.1.411",
  "pytest >= 9.1.1",
  "pytest-cov >= 7.1.0",
  "pytest-mock >= 3.15.1",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = [
  "F",      # Pyflakes (F)
  "E",      # pycodestyle error (E)
  "W",      # pycodestyle warning (W)
  "C90",    # mccabe (C90)
  "I",      # isort (I)
  "N",      # pep8-naming (N)
  "D",      # pydocstyle (D)
  "UP",     # pyupgrade (UP)
  "S",      # flake8-bandit (S)
  "B",      # flake8-bugbear (B)
  "C4",     # flake8-comprehensions (C4)
  "SIM",    # flake8-simplify (SIM)
  "ARG",    # flake8-unused-arguments (ARG)
  "PLC",    # Pylint convention (PLC)
  "PLE",    # Pylint error (PLE)
  "PLR",    # Pylint refactor (PLR)
  "PLW",    # Pylint warning (PLW)
  "FLY",    # flynt (FLY)
  "PERF",   # Perflint (PERF)
  "FURB",   # refurb (FURB)
  "RUF",    # Ruff-specific rules (RUF)
  "YTT",    # flake8-2020 (YTT)
  "ANN",    # flake8-annotations (ANN)
  "BLE",    # flake8-blind-except (BLE)
  "FBT",    # flake8-boolean-trap (FBT)
  "A",      # flake8-builtins (A)
  "COM",    # flake8-commas (COM)
  "DTZ",    # flake8-datetimez (DTZ)
  "T10",    # flake8-debugger (T10)
  "EM",     # flake8-errmsg (EM)
  "EXE",    # flake8-executable (EXE)
  "FA",     # flake8-future-annotations (FA)
  "ISC",    # flake8-implicit-str-concat (ISC)
  "ICN",    # flake8-import-conventions (ICN)
  "LOG",    # flake8-logging (LOG)
  "G",      # flake8-logging-format (G)
  "INP",    # flake8-no-pep420 (INP)
  "PIE",    # flake8-pie (PIE)
  "T20",    # flake8-print (T20)
  "PT",     # flake8-pytest-style (PT)
  "Q",      # flake8-quotes (Q)
  "RSE",    # flake8-raise (RSE)
  "SLF",    # flake8-self (SLF)
  "SLOT",   # flake8-slots (SLOT)
  "TID",    # flake8-tidy-imports (TID)
  "TCH",    # flake8-type-checking (TCH)
  "PTH",    # flake8-use-pathlib (PTH)
  "TD",     # flake8-todos (TD)
  "FIX",    # flake8-fixme (FIX)
  "ERA",    # eradicate (ERA)
  "PGH",    # pygrep-hooks (PGH)
  "TRY",    # tryceratops (TRY)
  "DOC",    # pydoclint (DOC)
]
ignore = [
  "missing-trailing-comma",                     # COM812
  "boolean-type-hint-positional-argument",      # FBT001
  "boolean-default-value-positional-argument",  # FBT002
  "datetime-timezone-utc",                      # UP017
]

[tool.ruff.lint.per-file-ignores]
"skills/pr-review-loop/tests/**/*.py" = [
  "undocumented-public-function",         # D103
  "import-private-name",                  # PLC2701
  "magic-value-comparison",               # PLR2004
  "assert",                               # S101
  "hardcoded-password-string",            # S105
  "private-member-access",                # SLF001
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40
max-bool-expr = 10

[tool.pyright]
exclude = ["build", ".venv", ".agents", ".claude"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "skills/pr-review-loop"
extraPaths = ["skills/pr-review-loop"]
reportPrivateUsage = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
addopts = [
  "--cov=scripts",
  "--cov-branch",
  "--doctest-modules",
  "--capture=no",
]
pythonpath = ["skills/pr-review-loop"]
testpaths = ["skills/pr-review-loop/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "9.0"

[tool.coverage.run]
source = ["scripts"]
omit = ["skills/pr-review-loop/tests/**"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_also = ["if TYPE_CHECKING:"]
