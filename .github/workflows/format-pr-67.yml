name: Format PR 67 branch

on:
  push:
    branches:
      - agent/fix-pr-review-loop-63-66

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Format canonical skill
        run: |
          uv sync --all-groups
          uv run ruff format skills/pr-review-loop
      - name: Commit formatting
        run: |
          if git diff --quiet -- skills/pr-review-loop; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/pr-review-loop
          git commit -m "Format canonical skill"
          git push origin "HEAD:${GITHUB_REF_NAME}"
