---
name: Apply review fixes
on:
  push:
    branches:
      - agent/implement-submit-command
    paths:
      - .github/review-fix.patch.gz.b64
      - .github/workflows/apply-review-fixes.yml
permissions:
  contents: write
concurrency:
  group: apply-review-fixes-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Apply reviewed changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          base64 --decode .github/review-fix.patch.gz.b64 \
            | gzip --decompress > /tmp/review-fix.patch
          git apply --check /tmp/review-fix.patch
          git apply /tmp/review-fix.patch
          rm .github/review-fix.patch.gz.b64
          rm .github/workflows/apply-review-fixes.yml
          python -m py_compile \
            skills/loopr/scripts/submit_core.py \
            skills/loopr/tests/test_submit_command.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Address submit review feedback"
          git push origin "HEAD:refs/heads/${BRANCH}"
