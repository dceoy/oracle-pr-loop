name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-analysis tools
        run: python -m pip install --disable-pip-version-check pyright ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check formatting and lint
        run: |
          ruff format --check review_loop.py tests/test_review_loop.py
          ruff check review_loop.py tests/test_review_loop.py

      - name: Type-check
        run: pyright review_loop.py tests/test_review_loop.py

      - name: Compile
        run: python -m compileall -q review_loop.py tests
