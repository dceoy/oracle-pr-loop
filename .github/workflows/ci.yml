---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  skill-structure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify canonical skills and discovery links
        run: |
          exit_status=0
          shopt -s nullglob
          skill_files=(skills/*/SKILL.md)
          if [ "${#skill_files[@]}" -eq 0 ]; then
            echo "::error::no canonical skills found under skills/*/SKILL.md"
            exit 1
          fi
          for skill_file in "${skill_files[@]}"; do
            name="$(basename "$(dirname "${skill_file}")")"
            if ! grep -qx "name: ${name}" "${skill_file}"; then
              echo "::error::${skill_file} does not declare 'name: ${name}'"
              exit_status=1
            fi
            for discovery_root in .agents/skills .claude/skills; do
              link="${discovery_root}/${name}"
              if [ ! -L "${link}" ]; then
                echo "::error::${link} is not a symlink"
                exit_status=1
                continue
              fi
              target="$(readlink "${link}")"
              if [ "${target}" != "../../skills/${name}" ]; then
                echo "::error::${link} -> ${target}, expected ../../skills/${name}"
                exit_status=1
              fi
            done
          done
          exit "${exit_status}"
  github-actions-lint-and-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
  markdown-lint:
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
  shell-lint:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/shell-lint.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      search-path: .
  bats-test:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/bats-test.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      search-path: .
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - skill-structure
      - github-actions-lint-and-scan
      - markdown-lint
      - shell-lint
      - bats-test
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
