---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  skill-structure:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
      - name: Verify canonical skills and discovery links
        run: |
          exit_status=0
          for name in pr-review-loop oracle-issue-plan oracle-pr-review pr-feedback-triage; do
            skill_file="skills/${name}/SKILL.md"
            if [ ! -f "${skill_file}" ]; then
              echo "::error::missing ${skill_file}"
              exit_status=1
              continue
            fi
            if ! grep -qx "name: ${name}" "${skill_file}"; then
              echo "::error::${skill_file} does not declare 'name: ${name}'"
              exit_status=1
            fi
            for discovery_root in .agents/skills .claude/skills; do
              link="${discovery_root}/${name}"
              if [ ! -L "${link}" ]; then
                echo "::error::${link} is not a symlink"
                exit_status=1
                continue
              fi
              target="$(readlink "${link}")"
              if [ "${target}" != "../../skills/${name}" ]; then
                echo "::error::${link} -> ${target}, expected ../../skills/${name}"
                exit_status=1
              fi
            done
          done
          exit "${exit_status}"
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs:
      - skill-structure
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main  # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      unconditional: true
