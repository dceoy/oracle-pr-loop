extend = "../../pyproject.toml"

# The canonical skill inherits the repository-wide lint policy. Keep narrowly
# scoped exceptions local to the refactored command boundary instead of
# weakening root-level checks for unrelated code.
[format]
preview = false

[lint.isort]
known-third-party = ["scripts"]

[lint.extend-per-file-ignores]
"scripts/github.py" = [
  "docstring-missing-returns",
  "docstring-missing-exception",
  "docstring-extraneous-exception",
  "slice-to-remove-prefix-or-suffix",
]
"scripts/submit.py" = [
  "docstring-missing-returns",
  "docstring-missing-exception",
  "docstring-extraneous-exception",
  "line-too-long",
]
"tests/**/*.py" = [
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-init",
  "docstring-missing-returns",
  "docstring-missing-exception",
  "import-private-name",
  "magic-value-comparison",
  "assert",
  "hardcoded-password-string",
  "hardcoded-password-func-arg",
  "private-member-access",
  "implicit-namespace-package",
  "compare-to-empty-string",
]
"tests/test_cli.py" = ["line-too-long"]
"tests/test_git_safety_regressions.py" = [
  "line-too-long",
  "typing-only-standard-library-import",
]
"tests/test_github.py" = ["boolean-positional-value-in-call"]
"tests/test_process.py" = ["line-too-long"]
